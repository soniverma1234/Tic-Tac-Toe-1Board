<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            justify-content: center;
            text-align: center;
            /* padding: 40px; */
        }
        .container{
            max-width: 360px;
            padding: 10px;
            border-radius: 5px;
            margin: 20px;
            background-color: #1f2937;
            justify-content: center;

            
        }
        .board{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .box{
            background-color: aliceblue;
            aspect-ratio: 1/1;
             /* width: 250px;
            height: 250px; */
            display: grid;
            place-items: center;
            border-radius: 10px;
            font-size: 60px;
            /* border: 1px solid blue; */
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);  
        }
        .box1{
            background-color: aliceblue;
            aspect-ratio: 1/1;
            color: #3b61b1;
            display: grid;
            place-items: center;
            border-radius: 10px;
            font-size: 60px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);  
        }
        @media(max-with:480px){
            .container{
                max-width: 95%;
                /* padding: 8px; */
            }

            box{
                font-size:40px
            }
        }

    </style>
</head>
<body>
  <div class="container">
    <div class="board">
        <div class="box">x</div>
        <div class="box1 ">o</div>
        <div class="box">x</div>

        <div class="box1">o</div>
        <div class="box">x</div>
        <div class="box1">o</div>

        <div class="box">x</div>
        <div class="box1">o</div>
        <div class="box">x</div>

    </div>
  </div>  
</body>
</html>
